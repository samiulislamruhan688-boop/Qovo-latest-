kind = "web"
previewPath = "/"
title = "Shikkha AI"
version = "1.0.0"
id = "artifacts/shikkha-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19049

[services.development]
run = "pnpm --filter @workspace/shikkha-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shikkha-ai", "run", "build" ]
publicDir = "artifacts/shikkha-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19049"
BASE_PATH = "/"
